format = """\ 
$username$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$time\
$line_break\
$character\
"""

# To allow ahead/behind status to be shown for canva as it's a bit slow
command_timeout = 2000

[username]
format = "[$user]($style)"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bold yellow"

[directory]
truncate_to_repo = false
truncation_length = 0

[time]
disabled = false
format = '[$time]($style) '
time_format = '%I:%M:%S %p'
style = "dimmed white"

[git_status]
format = '([\[$all_status$ahead_behind | \]]($style) )'
conflicted = " | ="
ahead = " | ⇡${count}"
behind = " | ⇣${count}"
diverged = " | ⇕ ⇡${ahead_count} ⇣${behind_count}"
untracked = " | ?"
stashed = " | @${count}"
modified = " | !"
staged = " | +"
renamed = " | »"
deleted = " | ✘"
